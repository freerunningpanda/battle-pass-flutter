name: matreshka
description: "Battle Pass screen — Flutter test task."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3
  flutter_svg: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/battle_pass/
    - assets/icons/battle_pass/

  fonts:
    - family: Geologica
      fonts:
        - asset: assets/fonts/Geologica-Variable.ttf
          weight: 400
        - asset: assets/fonts/Geologica-Variable.ttf
          weight: 500
        - asset: assets/fonts/Geologica-Variable.ttf
          weight: 600
        - asset: assets/fonts/Geologica-Variable.ttf
          weight: 700
